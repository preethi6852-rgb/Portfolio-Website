<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preethi | Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #cdd6f4; }
        nav { background: #11111b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        nav .logo { font-size: 1.4rem; font-weight: bold; color: #89b4fa; }
        nav ul { list-style: none; display: flex; gap: 2rem; }
        nav ul li a { color: #cdd6f4; text-decoration: none; font-size: 1rem; }
        nav ul li a:hover { color: #89b4fa; }
        footer { background: #11111b; text-align: center; padding: 1.5rem; color: #6c7086; margin-top: 4rem; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">💻 Preethi</div>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    {% block content %}{% endblock %}

    <footer>
        <p>© 2024 Preethi | Python Developer Intern</p>
    </footer>
</body>
</html>
